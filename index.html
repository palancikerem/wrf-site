<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRF-ARW Model | Kerem Palancı</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-bg: #1a1d29; --secondary-bg: #252936; --panel-bg: #2d3142;
            --border-color: #3d4254; --text-primary: #e8eaed; --text-secondary: #9aa0a6;
            --accent-blue: #4a9eff; --accent-hover: #6bb3ff; --shadow: rgba(0, 0, 0, 0.3);
        }
        body {
            background: linear-gradient(135deg, #1a1d29 0%, #252936 100%);
            color: var(--text-primary); font-family: 'Roboto', sans-serif; overflow: hidden;
            height: 100vh;
        }

        .header {
            background: linear-gradient(to bottom, #2d3142 0%, #252936 100%);
            border-bottom: 2px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow);
            position: relative; z-index: 100;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border-color); }
        .branding { display: flex; align-items: center; gap: 15px; }
        .logo-icon {
            width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent-blue), #2d6cb8);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: white; box-shadow: 0 4px 8px rgba(74, 158, 255, 0.3);
        }
        .branding-text h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
        .branding-text p { font-size: 0.75rem; color: var(--text-secondary); font-family: 'Roboto Mono', monospace; }

        .model-info { background: var(--panel-bg); padding: 8px 15px; border-radius: 6px; border: 1px solid var(--border-color); text-align: right; }
        .run-time { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; }
        .run-date { font-size: 0.9rem; font-weight: 500; color: var(--accent-blue); font-family: 'Roboto Mono', monospace; }

        .control-panel { display: grid; grid-template-columns: 1fr 1.8fr 1.2fr 1.2fr; gap: 15px; padding: 15px 30px; background: var(--secondary-bg); }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: var(--text-secondary); }
        
        select, button {
            background: var(--panel-bg); color: var(--text-primary); border: 1px solid var(--border-color);
            padding: 10px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; outline: none; font-size: 0.85rem;
        }
        select:hover, button:hover { border-color: var(--accent-blue); }
        .playback-controls { display: flex; gap: 5px; }
        .playback-controls button { flex: 1; font-weight: 500; }
        .playback-controls button.active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }

        /* Başlangıçta gizli, SKEWT seçilince açılır */
        #cityGroup { display: none; }

        .viewer-container {
            position: relative; height: calc(100vh - 280px); background: #0d0f14;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .map-canvas { max-width: 98%; max-height: 98%; object-fit: contain; }
        
        .loading-overlay {
            position: absolute; background: rgba(13, 15, 20, 0.8); padding: 15px 30px;
            border-radius: 8px; display: none; z-index: 10; text-align: center; border: 1px solid var(--border-color);
        }
        .error-overlay {
            position: absolute; background: rgba(30, 10, 10, 0.95); padding: 20px;
            border: 1px solid #ff4444; border-radius: 8px; display: none; text-align: center; z-index: 20;
        }

        .timeline-section { background: var(--secondary-bg); border-top: 2px solid var(--border-color); padding: 15px 30px; }
        .timeline-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .current-time { font-size: 1.2rem; font-weight: 500; font-family: 'Roboto Mono', monospace; color: var(--accent-blue); }
        .forecast-hour { background: var(--panel-bg); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border-color); font-size: 0.9rem; }
        input[type="range"] { width: 100%; height: 6px; cursor: pointer; accent-color: var(--accent-blue); }

        @media (max-width: 1024px) { .control-panel { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) {
            .control-panel { grid-template-columns: 1fr; padding: 10px; }
            .viewer-container { height: 45vh; }
            body { overflow-y: auto; height: auto; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <div class="branding">
                <div class="logo-icon">WRF</div>
                <div class="branding-text">
                    <h1>WRF-ARW Model</h1>
                    <p>Kerem Palancı • WRF Model</p>
                </div>
            </div>

            <div style="display: flex; align-items: center;">
                <div class="model-info">
                    <div class="run-time">Model Başlangıcı (UTC)</div>
                    <div class="run-date" id="modelRun">Bekleniyor...</div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <label>Domain</label>
                <select id="domSelect">
                    <option value="d01">Genel (D01 - 9km)</option>
                    <option value="d02" selected>Detay (D02 - 3km)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Meteorolojik Parametre</label>
                <select id="varSelect">
                    <optgroup label="Özel Diyagramlar">
                        <option value="SKEWT">Skew-T Log-P (Sounding)</option>
                    </optgroup>
                    <optgroup label="Yüzey Verileri">
                        <option value="T2" selected>2m Sıcaklık (°C)</option>
                        <option value="TD2">2m Çiy Noktası (°C)</option>
                        <option value="HEAT_INDEX">Hissedilen Sıcaklık (°C)</option>
                        <option value="SLP">Deniz Seviyesi Basıncı (hPa)</option>
                        <option value="UVMET10">10m Rüzgar Hamlesi (km/h)</option>
                        <option value="CLOUD">Toplam Bulutluluk (%)</option>
                    </optgroup>
                    <optgroup label="Yağış & Kar">
                        <option value="RAIN1H">Saatlik Yağış (mm)</option>
                        <option value="RAIN">Toplam Yağış (mm)</option>
                        <option value="SNOW1H">Saatlik Kar (cm)</option>
                        <option value="SNOW">Toplam Kar (cm)</option>
                        <option value="SNOWDEPTH">Kar Derinliği (cm)</option>
                        <option value="PTYPE">Yağış Türü ve Şiddeti</option>
                    </optgroup>
                    <optgroup label="Üst Seviye (Upper-Air)">
                        <option value="TEMP_850">850hPa Sıcaklık (°C)</option>
                        <option value="WIND_850">850hPa Rüzgar (km/h)</option>
                        <option value="TEMP_500">500hPa Sıcaklık (°C)</option>
                        <option value="WIND_300">300hPa Jet Rüzgarı (km/h)</option>
                    </optgroup>
                    <optgroup label="Konvektif Parametreler">
                        <option value="CAPE">CAPE (J/kg)</option>
                        <option value="MDBZ">Simüle Radar (dBZ)</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-group" id="cityGroup">
                <label>Lokasyon (Skew-T)</label>
                <select id="citySelect">
                    <option value="KAGITHANE">Kağıthane</option>
                    <option value="BESIKTAS">Beşiktaş</option>
                    <option value="CATALCA">Çatalca</option>
                    <option value="GOZTEPE">Göztepe</option>
                    <option value="ISTANBUL_MERKEZ">İstanbul Merkez</option>
                    <option value="AYDOS">Aydos</option>
                    <option value="CERKEZKOY">Çerkezköy</option>
                </select>
            </div>

            <div class="control-group">
                <label>Navigasyon</label>
                <div class="playback-controls">
                    <button id="prevBtn">◀</button>
                    <button id="playBtn">▶ Play</button>
                    <button id="nextBtn">▶</button>
                </div>
            </div>
        </div>
    </div>

    <div class="viewer-container">
        <div class="loading-overlay" id="loader">Yükleniyor...</div>
        <div class="error-overlay" id="errorMsg">
            <h3 style="color:#ff4444; margin-bottom:10px;">⚠ Görsel Mevcut Değil</h3>
            <p id="errorDetail" style="font-family:'Roboto Mono'; font-size:0.8rem; opacity:0.8"></p>
        </div>
        <img id="mapImage" class="map-canvas" src="" alt="WRF Görsel">
    </div>

    <div class="timeline-section">
        <div class="timeline-info">
            <div style="display:flex; align-items:center; gap:20px">
                <div class="current-time" id="dateDisplay">--.--.---- --:--</div>
                <div class="forecast-hour" id="forecastHour">+00h</div>
            </div>
            <div id="frameDisplay" style="font-family:'Roboto Mono'; font-size:0.85rem; opacity:0.6">Frame: 0 / 0</div>
        </div>
        <input type="range" id="timeSlider" min="0" value="0" step="1">
    </div>

    <script>
        const elements = {
            img: document.getElementById('mapImage'),
            dom: document.getElementById('domSelect'),
            variable: document.getElementById('varSelect'),
            city: document.getElementById('citySelect'),
            cityGroup: document.getElementById('cityGroup'),
            slider: document.getElementById('timeSlider'),
            dateDisp: document.getElementById('dateDisplay'),
            frameDisp: document.getElementById('frameDisplay'),
            forecastHour: document.getElementById('forecastHour'),
            modelRun: document.getElementById('modelRun'),
            playBtn: document.getElementById('playBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            loader: document.getElementById('loader'),
            errorMsg: document.getElementById('errorMsg'),
            errorDetail: document.getElementById('errorDetail')
        };

        let fileRegistry = {};
        let isPlaying = false;
        let playInterval;

        async function init() {
            try {
                // file_list.json'dan verileri çek
                const response = await fetch('./images/file_list.json?t=' + Date.now());
                if (!response.ok) throw new Error("Dosya listesi alınamadı.");
                fileRegistry = await response.json();

                setupEventListeners();
                refreshSlider();
                updateMap();
            } catch (e) {
                showError("Veri Yükleme Hatası: " + e.message);
            }
        }

        function setupEventListeners() {
            elements.slider.oninput = updateMap;
            elements.dom.onchange = () => { refreshSlider(); updateMap(); };
            elements.city.onchange = updateMap;
            elements.variable.onchange = () => {
                // Skew-T seçilirse şehir listesini göster
                elements.cityGroup.style.display = (elements.variable.value === "SKEWT") ? "flex" : "none";
                updateMap();
            };
            elements.playBtn.onclick = togglePlay;
            elements.prevBtn.onclick = () => step(-1);
            elements.nextBtn.onclick = () => step(1);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === "ArrowLeft") step(-1);
                if (e.key === "ArrowRight") step(1);
                if (e.key === " ") { e.preventDefault(); togglePlay(); }
            });
        }

        function refreshSlider() {
            const currentDom = elements.dom.value;
            const times = fileRegistry[currentDom] || [];
            if (times.length > 0) {
                elements.slider.max = times.length - 1;
                elements.slider.value = 0;
                const first = times[0];
                elements.modelRun.innerText = `${first.substring(6,8)}.${first.substring(4,6)}.${first.substring(0,4)} ${first.substring(9,11)}:00Z`;
            }
        }

        function updateMap() {
            const currentDom = elements.dom.value;
            const times = fileRegistry[currentDom] || [];
            if (times.length === 0) return;

            const idx = parseInt(elements.slider.value);
            const time = times[idx];
            const varCode = elements.variable.value;
            
            let filename;
            if (varCode === "SKEWT") {
                // Skew-T: SKEWT_D02_CITY_YYYYMMDD_HHMM.png (Saniye yok)
                filename = `SKEWT_${currentDom.toUpperCase()}_${elements.city.value}_${time.substring(0,8)}_${time.substring(9,13)}.png`;
            } else {
                // Haritalar: d01_VAR_YYYYMMDD_HHMMSS.webp (Saniye var)
                filename = `${currentDom}_${varCode}_${time}.webp`;
            }

            const url = `./images/${filename}`;

            // Alt bilgileri güncelle
            elements.dateDisp.innerText = `${time.substring(6,8)}.${time.substring(4,6)} | ${time.substring(9,11)}:${time.substring(11,13)} UTC`;
            elements.frameDisp.innerText = `Frame: ${idx + 1} / ${times.length}`;
            
            const start = parseWRFTime(times[0]);
            const current = parseWRFTime(time);
            const diff = Math.round((current - start) / 3600000);
            elements.forecastHour.innerText = `+${diff}h`;

            elements.loader.style.display = 'block';
            elements.errorMsg.style.display = 'none';

            const tempImg = new Image();
            tempImg.onload = () => {
                elements.img.src = url;
                elements.loader.style.display = 'none';
            };
            tempImg.onerror = () => {
                elements.loader.style.display = 'none';
                elements.errorMsg.style.display = 'block';
                elements.errorDetail.innerText = filename;
            };
            tempImg.src = url;
        }

        function parseWRFTime(tStr) {
            return new Date(
                tStr.substring(0, 4),
                parseInt(tStr.substring(4, 6)) - 1,
                tStr.substring(6, 8),
                tStr.substring(9, 11),
                tStr.substring(11, 13)
            );
        }

        function step(dir) {
            const times = fileRegistry[elements.dom.value] || [];
            let v = parseInt(elements.slider.value) + dir;
            if (v >= times.length) v = 0;
            if (v < 0) v = times.length - 1;
            elements.slider.value = v;
            updateMap();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            elements.playBtn.innerHTML = isPlaying ? "⏸ Pause" : "▶ Play";
            if (isPlaying) playInterval = setInterval(() => step(1), 600);
            else clearInterval(playInterval);
        }

        function showError(m) {
            elements.errorMsg.style.display = 'block';
            elements.errorDetail.innerText = m;
        }

        init();
    </script>
</body>
</html>
